@if (!isOnLoginPage()) {
    <button class="burger" (click)="toggleMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M0 0h16v16H0z" fill="none" />
            <path fill="currentColor" d="M2 2.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0 5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m.5 4.5a.5.5 0 0 0 0 1h11a.5.5 0 0 0 0-1z" />
        </svg>
    </button>

    <ul class="nav-links" [class.open]="isMenuOpen()">
        @if(!this.authService.jwtInfo()) {
            <li>
                <a routerLink="/login" (click)="closeMenu()">Connexion</a>
            </li>
        } @else {
            <li>
                <a routerLink="/home" (click)="closeMenu()">Accueil</a>
            </li>
            <li>
                <a routerLink="#" (click)="closeMenu()">Mon Compte</a>
            </li>
            <li>
                <a href="" (click)="logout()">Déconnexion</a>
            </li>
        }
    </ul>

}
