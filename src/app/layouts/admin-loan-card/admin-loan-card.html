<div class="line-card">
    <div class="header">
        <svg class="card-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <rect width="18" height="13" x="3" y="4" rx="2"/>
            <path d="M1 20h22"/>
        </svg>
        <div class="line-card-info">
            <div>
                <span class="id">{{loan()?.id}}</span> - 
                <span class="model">Equipement {{loan()?.idEquipment}}</span>
                <span class="model">Utilisateur {{loan()?.idUser}}</span>
            </div>

            <div>
                <span class="status">
                    @if (loan()?.returnDate) {
                        Cloturé
                    } @else if (true) {
                        Non Cloturé
                    }
                    
                </span> - 
            </div>

            <div>
                <span class="start-date">{{ loan()?.startDate }}</span> au 
                @if (loan()?.returnDate) {
                    <span class="end-date">{{ loan()?.returnDate }}</span>
                } @else {
                    <span class="end-date">{{ loan()?.endDate }}</span>
                }
                
            </div>
        </div>
        <div class="button-container">
            <!-- <button type="button" (click)="">v</button> -->
        </div>
    </div>
    <div class="body" >

    </div>
    
</div>
