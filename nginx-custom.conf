server {
    listen 80;
    serve_name cda-nicolas.stagiairesmns.fr

    # Sert l'application Angular
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # obligatoire pour le routing Angular
    }

    # Redirige les appels /api/* vers le back Spring Boot
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}