name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  docker-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/locnes-front:${{ github.sha }} .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/locnes-front:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/locnes-front:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/locnes-front:latest
  
  deploy:
    runs-on: self-hosted
    needs: docker-push

    steps:
      - name: Deploy on server
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          command: |
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/locnes-front:${{ github.sha }}
            docker stop locnes-front || true
            docker rm locnes-front || true
            cd /opt/locnes
            docker compose up -d