name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build -t nicol49/demo-devops-loc_mns_front .

    - name: extract version from package.json
      run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV

    - name: TAG the Docker image
      run: docker tag nicol49/demo-devops-loc_mns_front nicol49/demo-devops-loc_mns_front:${{ env.VERSION }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: nicol49
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker images
      run: |
        docker push nicol49/demo-devops-loc_mns_front 
        docker push nicol49/demo-devops-loc_mns_front:${{ env.VERSION }}
